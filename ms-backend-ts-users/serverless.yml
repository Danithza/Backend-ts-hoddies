service: ms-users

provider:
  name: aws
  runtime: nodejs20.x

functions:
  app:
    handler: dist/main/ts/com/ecommerce/users/lambda/handler.handler
    events:
      - http:
          path: users/{proxy+}
          method: any

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3008
    lambdaPort: 3006