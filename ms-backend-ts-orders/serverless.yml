service: ms-orders

provider:
  name: aws
  runtime: nodejs20.x

functions:
  app:
    handler: dist/main/ts/com/ecommerce/orders/lambda/handler.handler
    timeout: 30
    events:
      - http:
          path: orders/{proxy+}
          method: any

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3004